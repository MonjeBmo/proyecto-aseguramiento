version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rutaexpress_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rutaexpress}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rutaexpress_api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rutaexpress}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_prod}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src

  # Entrada publica: tunel saliente hacia Cloudflare, sin exponer puertos ni IP.
  # Activar con: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: rutaexpress_cloudflared
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://backend:3000"]
    profiles: ["tunnel"]
    depends_on:
      backend:
        condition: service_started
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
